<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RobPac Publishing | Independent Books, Guides & Illustrated Stories</title>
  <meta name="description" content="Browse RobPac Publishing's catalog: independent books, guides, fiction, and illustrated stories. Discover by genre, search by title, open any book for details, and buy on Amazon." />
  <style>
    :root{
      --bg0:#070a12; --bg1:#0b1022; --card:#0e162e; --muted:#a7b0c2;
      --text:#e9eefc; --accent:#caa547; --accent2:#7aa7ff; --line:rgba(255,255,255,.08);
      --shadow:0 12px 40px rgba(0,0,0,.5);
      --radius:18px;
      --font: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background: radial-gradient(900px 500px at 20% 0%, rgba(202,165,71,.18), transparent 55%),
                  radial-gradient(1000px 600px at 80% 10%, rgba(122,167,255,.15), transparent 60%),
                  linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
    }
    a{color:inherit}
    .wrap{max-width:1200px;margin:0 auto;padding:18px 18px 42px}
    header{
      position:sticky;top:0;z-index:10;
      backdrop-filter:saturate(180%) blur(10px);
      background: linear-gradient(180deg, rgba(7,10,18,.92), rgba(7,10,18,.55));
      border-bottom:1px solid var(--line);
    }
    .topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;max-width:1200px;margin:0 auto}
    .brand{display:flex;align-items:center;gap:12px;min-width:220px}
    .logo{
      width:34px;height:34px;border-radius:50%;
      background: rgba(255,255,255,.06);
      border:1px solid var(--line);
      display:grid;place-items:center;
      overflow:hidden;
    }
    .logo img{width:100%;height:100%;object-fit:cover}
    .title{
      font-family: "Georgia", serif;
      font-size:28px;
      letter-spacing:.5px;
      color:var(--accent);
      text-shadow: 0 2px 14px rgba(0,0,0,.6);
      margin:0;
      line-height:1;
      white-space:nowrap;
    }
    .controls{
      display:flex;align-items:center;gap:10px;
      flex:1;
      justify-content:flex-end;
      min-width:0;
    }
    .search{
      flex:1;
      max-width:460px;
      position:relative;
      min-width:160px;
    }
    .search input{
      width:100%;
      background: rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px 10px 36px;
      border-radius:999px;
      outline:none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .search input::placeholder{color:rgba(233,238,252,.55)}
    .search .icon{
      position:absolute;left:12px;top:50%;transform:translateY(-50%);
      opacity:.7;font-size:14px
    }
    select{
      background: rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;
      border-radius:999px;
      outline:none;
    }
    main{padding-top:18px}
    .hero{
      display:flex;gap:18px;align-items:stretch;
      background: linear-gradient(135deg, rgba(122,167,255,.15), rgba(202,165,71,.10));
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .hero .left{
      flex:1;min-width:260px;padding:22px 22px 18px;
      background: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.05));
    }
    .pill{
      display:inline-flex;gap:8px;align-items:center;
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.10);
      padding:6px 10px;border-radius:999px;
      font-size:12px;color:rgba(233,238,252,.85);
      margin-bottom:12px;
    }
    .hero h2{
      margin:0 0 10px;
      font-size:34px;
      line-height:1.1;
      letter-spacing:-.2px;
    }
    .hero .right{
      width:44%;
      min-width:320px;
      background: radial-gradient(700px 350px at 30% 10%, rgba(202,165,71,.25), transparent 60%),
                  radial-gradient(700px 350px at 60% 60%, rgba(122,167,255,.25), transparent 60%),
                  linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.35));
      position:relative;
    }
    .hero .right::after{
      content:"";
      position:absolute;inset:0;
      background-image:url("covers/placeholder.svg");
      background-size:420px auto;
      background-repeat:no-repeat;
      background-position: 70% 55%;
      opacity:.18;
      filter: blur(.4px);
      pointer-events:none;
    }
    .countrow{
      display:flex;align-items:center;justify-content:space-between;
      margin:20px 2px 10px;
      color:rgba(233,238,252,.85);
    }
    .count{
      font-size:13px;
      opacity:.9;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap:14px;
    }
    .card{
      background: rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      cursor:pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
      outline:none;
    }
    .card:hover, .card:focus{
      transform: translateY(-3px);
      border-color: rgba(202,165,71,.35);
      background: rgba(255,255,255,.06);
    }
    .cover{
      aspect-ratio: 3 / 4.2;
      background: rgba(0,0,0,.25);
      display:grid;place-items:center;
    }
    .cover img{
      width:100%;height:100%;
      object-fit:cover;
      display:block;
    }
    .info{padding:10px 10px 12px}
    .info .title{
      font-family: var(--font);
      font-size:12.5px;
      color:var(--text);
      letter-spacing:0;
      white-space:normal;
      margin:0 0 8px;
      text-shadow:none;
      line-height:1.25;
    }
    .genre{display:flex;gap:6px;flex-wrap:wrap}
    .badge{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(233,238,252,.85);
    }
    .modal{
      position:fixed;inset:0;
      background: rgba(0,0,0,.65);
      display:none;
      align-items:center;justify-content:center;
      padding:20px;
      z-index:50;
    }
    .modal.open{display:flex}
    .modal .panel{
      width:min(980px, 100%);
      max-height: min(86vh, 900px);
      overflow:auto;
      background: linear-gradient(180deg, rgba(14,22,46,.98), rgba(10,16,34,.98));
      border:1px solid rgba(255,255,255,.10);
      border-radius:22px;
      box-shadow: 0 24px 80px rgba(0,0,0,.7);
      position:relative;
    }
    .modal .close{
      position:absolute;right:12px;top:12px;
      width:40px;height:40px;border-radius:12px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      cursor:pointer;
      display:grid;place-items:center;
      font-size:18px;
    }
    .modal .content{
      display:grid;
      grid-template-columns: 320px 1fr;
      gap:18px;
      padding:18px;
    }
    .modal .mcover{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.2);
      aspect-ratio: 3 / 4.2;
    }
    .modal .mcover img{width:100%;height:100%;object-fit:cover;display:block}
    .modal h3{margin:2px 0 8px;font-size:22px}
    .modal .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .modal .desc{
      color: rgba(233,238,252,.88);
      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;
    }
    .actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
    .btn{
      display:inline-flex;
      align-items:center;justify-content:center;
      gap:8px;
      padding:10px 14px;
      border-radius:14px;
      text-decoration:none;
      font-weight:600;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:var(--text);
      cursor:pointer;
    }
    .btn.primary{
      background: linear-gradient(135deg, rgba(202,165,71,.90), rgba(202,165,71,.55));
      border-color: rgba(202,165,71,.7);
      color:#111;
    }
    footer{
      margin-top:24px;
      color:rgba(233,238,252,.55);
      font-size:12px;
      text-align:center;
      padding:18px 6px;
    }
    @media (max-width: 860px){
      .hero{flex-direction:column}
      .hero .right{width:100%;min-width:0;height:200px}
      .modal .content{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <img src="covers/placeholder.svg" alt="">
        </div>
        <h1 class="title">RobPac Publishing</h1>
      </div>

      <div class="controls">
        <div class="search">
          <span class="icon">⌕</span>
          <input id="q" type="search" placeholder="Search by title..." autocomplete="off" />
        </div>
        <select id="genre">
          <option value="">All genres</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-label="Hero">
      <div class="left">
        <div class="pill">● Independent books, guides & illustrated stories</div>
        <h2>Browse the catalog and find your next read.</h2>
      </div>
      <div class="right" aria-hidden="true"></div>
    </section>

    <div class="countrow">
      <div id="count" class="count">0 books</div>
    </div>

    <div id="grid" class="grid" aria-label="Books grid"></div>

    <footer>
      © <span id="year"></span> RobPac Publishing. All rights reserved.
    </footer>
  </main>

  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-label="Book details">
    <div class="panel" role="document">
      <button class="close" id="close" aria-label="Close">×</button>
      <div class="content">
        <div class="mcover"><img id="mCover" src="covers/placeholder.svg" alt=""></div>
        <div class="mtext">
          <h3 id="mTitle"></h3>
          <div id="mMeta" class="meta"></div>
          <div id="mDesc" class="desc"></div>
          <div class="actions">
            <a id="mBuy" class="btn primary" href="#" target="_blank" rel="noopener">Buy on Amazon</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const PLACEHOLDER = "/covers/placeholder.svg";

    const $q = document.getElementById("q");
    const $genre = document.getElementById("genre");
    const $grid = document.getElementById("grid");

    const state = {
      all: [],
      filtered: [],
      genres: new Set(),
      q: "",
      genre: ""
    };

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function normalizeBook(raw){
      const title = raw.title ?? raw.titolo ?? "Untitled";
      const genre = raw.genre ?? raw.genere ?? "";
      const description = raw.description ?? raw.descrizione ?? "";
      const amazonLink = raw.amazonLink ?? raw.linkAmazon ?? raw.link ?? "";
      const cover = raw.cover ?? raw.immagine ?? raw.image ?? raw.thumbnail ?? "";

      return { title, genre, description, amazonLink, cover };
    }

    function coverSrc(url) {
      if (!url) return PLACEHOLDER;
      return String(url).trim();
    }

    function createCard(book, onOpen) {
      const card = document.createElement("article");
      card.className = "card";
      card.tabIndex = 0;

      const cover = document.createElement("div");
      cover.className = "cover";

      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = book.title;
      img.src = coverSrc(book.cover);
      img.onerror = () => { img.src = PLACEHOLDER; };

      cover.appendChild(img);

      const info = document.createElement("div");
      info.className = "info";

      const h = document.createElement("h3");
      h.className = "title";
      h.textContent = book.title;

      const g = document.createElement("div");
      g.className = "genre";

      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = book.genre || "Uncategorized";

      g.appendChild(b);

      info.appendChild(h);
      info.appendChild(g);

      card.appendChild(cover);
      card.appendChild(info);

      const open = () => onOpen(book);
      card.addEventListener("click", open);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });

      return card;
    }

    function setCount(n, total) {
      const el = document.getElementById("count");
      el.textContent = total === n ? `${n} books` : `${n} books (filtered from ${total})`;
    }

    function openModal(book) {
      const modal = document.getElementById("modal");
      const mTitle = document.getElementById("mTitle");
      const mDesc = document.getElementById("mDesc");
      const mCover = document.getElementById("mCover");
      const mBuy = document.getElementById("mBuy");
      const mMeta = document.getElementById("mMeta");

      mTitle.textContent = book.title;
      mDesc.textContent = book.description || "No description available.";
      mCover.src = coverSrc(book.cover);
      mCover.alt = book.title;
      mCover.onerror = () => { mCover.src = PLACEHOLDER; };

      mMeta.innerHTML = "";
      const genreBadge = document.createElement("span");
      genreBadge.className = "badge";
      genreBadge.textContent = book.genre || "Uncategorized";
      mMeta.appendChild(genreBadge);

      if (book.amazonLink) {
        mBuy.href = book.amazonLink;
        mBuy.style.display = "inline-flex";
      } else {
        mBuy.href = "#";
        mBuy.style.display = "none";
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("modal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function draw() {
      $grid.innerHTML = "";
      for (const book of state.filtered) {
        $grid.appendChild(createCard(book, openModal));
      }
      setCount(state.filtered.length, state.all.length);
    }

    function applyFilters() {
      const q = state.q.trim().toLowerCase();
      const g = state.genre;

      state.filtered = state.all.filter(b => {
        const okQ = !q || String(b.title).toLowerCase().includes(q);
        const okG = !g || (b.genre || "").toLowerCase() === g.toLowerCase();
        return okQ && okG;
      });

      draw();
    }

    function buildGenreOptions() {
      const genres = Array.from(state.genres).filter(Boolean).sort((a,b)=>a.localeCompare(b));
      const keepFirst = $genre.querySelector('option[value=""]');
      $genre.innerHTML = "";
      $genre.appendChild(keepFirst);
      for (const g of genres) {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = g;
        $genre.appendChild(opt);
      }
    }

    async function loadBooks() {
      const res = await fetch("books.json?cb=" + Date.now(), { cache: "no-store" });
      const raw = await res.json();
      state.all = raw.map(normalizeBook);
      state.genres = new Set(state.all.map(b => (b.genre || "").trim()).filter(Boolean));
      buildGenreOptions();
      state.filtered = [...state.all];
      draw();
    }

    document.getElementById("close").addEventListener("click", closeModal);
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    $q.addEventListener("input", () => {
      state.q = $q.value;
      applyFilters();
    });

    $genre.addEventListener("change", () => {
      state.genre = $genre.value;
      applyFilters();
    });

    document.getElementById("year").textContent = new Date().getFullYear();

    loadBooks().catch(err => {
      console.error("Failed to load books.json", err);
      setCount(0, 0);
    });
  </script>
</body>
</html>
