<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RobPac Publishing | Independent Books, Guides & Illustrated Stories</title>
  <meta name="description" content="RobPac Publishing: independent books, guides, and illustrated stories. Browse the catalog and buy on Amazon." />
  <meta name="robots" content="index,follow" />
  <link rel="icon" href="assets/logo3senzasfondo.png" />

  <style>
    :root{
      --bg:#0b0f19;
      --panel:#101827;
      --panel2:#0f172a;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --line:rgba(255,255,255,.08);
      --accent:#7c3aed;
      --accent2:#22c55e;
      --shadow:0 18px 45px rgba(0,0,0,.45);
      --radius:18px;
      --radius2:22px;
      --container:1180px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 20% 10%, rgba(124,58,237,.25), transparent 55%),
                  radial-gradient(900px 520px at 85% 15%, rgba(34,197,94,.18), transparent 55%),
                  linear-gradient(180deg, #050812, var(--bg) 35%, #050812);
      color:var(--text);
    }
    a{color:inherit; text-decoration:none}
    .container{max-width:var(--container); margin:0 auto; padding:0 18px}
    .nav{
      position:sticky; top:0; z-index:30;
      backdrop-filter: blur(10px);
      background: rgba(5,8,18,.55);
      border-bottom:1px solid var(--line);
    }
    .nav-inner{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 0;
      gap:16px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      min-width: 220px;
    }
    .brand img.logo{width:52px; height:52px; object-fit:contain}
    .brand img.title{height:26px; object-fit:contain}
    .controls{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      justify-content:flex-end;
    }
    .input, .select{
      height:40px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(16,24,39,.75);
      color: var(--text);
      padding: 0 12px;
      outline:none;
    }
    .input{width:min(380px, 62vw)}
    .select{min-width:190px}
    .btn{
      height:40px;
      border-radius:12px;
      border:1px solid var(--line);
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(34,197,94,.55));
      color:#fff;
      padding:0 14px;
      cursor:pointer;
      font-weight:650;
      letter-spacing:.2px;
      box-shadow: 0 10px 26px rgba(124,58,237,.20);
      transition: transform .12s ease, filter .12s ease;
      white-space:nowrap;
    }
    .btn:hover{transform: translateY(-1px); filter:saturate(1.05)}
    .hero{
      padding:18px 0 6px;
    }
    .hero-card{
      border-radius: var(--radius2);
      background: linear-gradient(180deg, rgba(16,24,39,.78), rgba(16,24,39,.52));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      min-height: 360px;
    }
    .hero-media{
      position:absolute; inset:0;
      background: radial-gradient(900px 500px at 20% 30%, rgba(124,58,237,.22), transparent 65%),
                  radial-gradient(700px 420px at 85% 25%, rgba(34,197,94,.16), transparent 65%);
      pointer-events:none;
    }
    .hero-media img{
      position:absolute;
      right:0; top:0;
      width:min(720px, 66vw);
      height:100%;
      object-fit:cover;
      opacity:.38;
      mask-image: linear-gradient(90deg, transparent, rgba(0,0,0,.35) 18%, #000 55%);
    }
    .hero-content{
      position:relative;
      padding: 22px;
      max-width: 720px;
    }
    .kicker{
      display:inline-flex; gap:10px; align-items:center;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(15,23,42,.55);
      color: var(--muted);
      font-size: 13px;
    }
    .kicker .dot{
      width:8px; height:8px; border-radius:999px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 0 4px rgba(124,58,237,.18);
    }
    .hero h1{
      margin: 14px 0 10px;
      font-size: clamp(26px, 2.8vw, 40px);
      line-height:1.12;
      letter-spacing:-.4px;
    }
    .hero p{
      margin:0;
      color: var(--muted);
      font-size: 15.5px;
      line-height:1.62;
      max-width: 62ch;
    }
    .grid-wrap{
      padding: 18px 0 36px;
    }
    .meta-row{
      display:flex; align-items:baseline; justify-content:space-between;
      gap:12px; flex-wrap:wrap;
      margin: 18px 0 12px;
    }
    .count{
      color: var(--muted);
      font-size: 13.5px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat( auto-fill, minmax(210px, 1fr) );
      gap: 14px;
    }
    .card{
      border-radius: var(--radius);
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(16,24,39,.75), rgba(16,24,39,.46));
      box-shadow: 0 8px 28px rgba(0,0,0,.28);
      overflow:hidden;
      cursor:pointer;
      transition: transform .12s ease, border-color .12s ease;
      display:flex; flex-direction:column;
      min-height: 316px;
    }
    .card:hover{transform: translateY(-2px); border-color: rgba(124,58,237,.35)}
    .cover{
      width:100%;
      aspect-ratio: 2/3;
      background: rgba(0,0,0,.22);
      border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .cover img{
      width:100%; height:100%;
      object-fit: cover;
      display:block;
    }
    .info{padding:12px 12px 14px}
    .title{
      font-weight:700;
      font-size: 14.5px;
      line-height:1.25;
      margin:0 0 8px;
      display:-webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow:hidden;
      min-height: 54px;
    }
    .genre{
      font-size: 12.5px;
      color: var(--muted);
      display:flex; gap:8px; align-items:center;
    }
    .badge{
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid var(--line);
      background: rgba(15,23,42,.55);
      color: var(--muted);
    }
    footer{
      border-top:1px solid var(--line);
      padding: 18px 0 24px;
      color: var(--muted);
      font-size: 13px;
      text-align:center;
    }

    /* Modal */
    .modal{
      position:fixed; inset:0;
      display:none;
      align-items:center; justify-content:center;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(8px);
      z-index:60;
      padding: 16px;
    }
    .modal.open{display:flex}
    .modal-card{
      width: min(980px, 96vw);
      border-radius: 22px;
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(16,24,39,.92), rgba(16,24,39,.72));
      box-shadow: var(--shadow);
      overflow:hidden;
      display:grid;
      grid-template-columns: 320px 1fr;
    }
    @media (max-width: 820px){
      .modal-card{grid-template-columns: 1fr}
    }
    .modal-cover{
      background: rgba(0,0,0,.28);
      border-right:1px solid var(--line);
      display:flex; align-items:center; justify-content:center;
      padding: 14px;
    }
    @media (max-width: 820px){
      .modal-cover{border-right:none; border-bottom:1px solid var(--line)}
    }
    .modal-cover img{
      width: 100%;
      max-width: 280px;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
    }
    .modal-body{padding: 16px 18px 18px}
    .modal-top{
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    }
    .modal-body h2{
      margin: 6px 0 10px;
      font-size: 20px;
      line-height:1.22;
    }
    .close{
      width:42px; height:42px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(15,23,42,.55);
      color: var(--text);
      cursor:pointer;
      display:grid; place-items:center;
      font-size: 18px;
    }
    .modal-body .meta{
      display:flex; gap:10px; flex-wrap:wrap;
      margin: 0 0 12px;
    }
    .modal-body .desc{
      color: var(--text);
      opacity:.92;
      line-height: 1.68;
      font-size: 14.5px;
      white-space: pre-wrap;
    }
    .modal-actions{
      display:flex; gap:10px; flex-wrap:wrap;
      margin-top: 14px;
    }
    .btn2{
      height:42px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(15,23,42,.55);
      color: var(--text);
      padding: 0 14px;
      cursor:pointer;
      font-weight:650;
      transition: transform .12s ease;
    }
    .btn2:hover{transform: translateY(-1px)}
    .btn-buy{
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(34,197,94,.55));
      color:#fff;
      box-shadow: 0 10px 26px rgba(34,197,94,.12);
    }
    .error{
      border:1px solid rgba(244,63,94,.35);
      background: rgba(244,63,94,.10);
      color:#fecdd3;
      padding: 12px 14px;
      border-radius: 16px;
      line-height:1.5;
    }
  </style>
</head>

<body>
  <header class="nav">
    <div class="container nav-inner">
      <div class="brand">
        <img class="logo" src="assets/logo3senzasfondo.png" alt="RobPac Publishing logo" />
        <img class="title" src="assets/robpac-title.png" alt="RobPac Publishing" />
      </div>

      <div class="controls" role="search">
        <input id="q" class="input" type="search" placeholder="Search by title..." autocomplete="off" />
        <select id="genre" class="select" aria-label="Filter by genre">
          <option value="">All genres</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-card">
          <div class="hero-media" aria-hidden="true">
            <img src="assets/hero.png" alt="" />
          </div>
          <div class="hero-content">
            <div class="kicker"><span class="dot"></span> Independent books, guides & illustrated stories</div>
            <h1>Browse the catalog and find your next read.</h1>
            <p>
              This page is optimized for fast browsing: filter by genre, search by title, open any book for details, and buy on Amazon.
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="grid-wrap">
      <div class="container">
        <div class="meta-row">
          <div class="count" id="count">Loading…</div>
        </div>
        <div id="grid" class="grid" aria-live="polite"></div>
        <div id="err" class="error" style="display:none; margin-top:12px;"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Book details">
      <div class="modal-cover">
        <img id="mCover" src="/covers/placeholder.svg" alt="" />
      </div>
      <div class="modal-body">
        <div class="modal-top">
          <div>
            <div class="meta" id="mMeta"></div>
            <h2 id="mTitle"></h2>
          </div>
          <button class="close" id="mClose" aria-label="Close">✕</button>
        </div>
        <div class="desc" id="mDesc"></div>
        <div class="modal-actions">
          <a id="mBuy" class="btn2 btn-buy" href="#" target="_blank" rel="noopener">Buy on Amazon</a>
          <button class="btn2" id="mCopy">Copy Amazon link</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    © <span id="year"></span> RobPac Publishing
  </footer>

  <script>
    const PLACEHOLDER = "/covers/placeholder.svg";

    function normalizeBook(raw) {
      if (!raw || typeof raw !== "object") return null;

      const title = raw.titolo ?? raw.title ?? raw.name ?? "";
      const genre = raw.genere ?? raw.genre ?? raw.category ?? "";
      const cover = raw.immagine ?? raw.image ?? raw.cover ?? raw.thumbnail ?? "";
      const amazonLink = raw.linkAmazon ?? raw.amazonLink ?? raw.url ?? raw.link ?? "";
      const description = raw.descrizione ?? raw.description ?? raw.longDescription ?? raw.desc ?? "";

      const safe = {
        title: String(title || "").trim(),
        genre: String(genre || "").trim(),
        cover: String(cover || "").trim(),
        amazonLink: String(amazonLink || "").trim(),
        description: String(description || "").trim(),
      };

      if (!safe.title) return null;
      return safe;
    }

    function uniqSorted(arr) {
      return Array.from(new Set(arr.filter(Boolean))).sort((a,b) => a.localeCompare(b));
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function coverSrc(url) {
      if (!url) return PLACEHOLDER;
      return url;
    }

    function createCard(book, onOpen) {
      const card = document.createElement("article");
      card.className = "card";
      card.tabIndex = 0;

      const cover = document.createElement("div");
      cover.className = "cover";

      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = book.title;
      img.src = coverSrc(book.cover);
      img.onerror = () => { img.src = PLACEHOLDER; };

      cover.appendChild(img);

      const info = document.createElement("div");
      info.className = "info";

      const h = document.createElement("h3");
      h.className = "title";
      h.textContent = book.title;

      const g = document.createElement("div");
      g.className = "genre";

      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = book.genre || "Uncategorized";

      g.appendChild(b);

      info.appendChild(h);
      info.appendChild(g);

      card.appendChild(cover);
      card.appendChild(info);

      const open = () => onOpen(book);
      card.addEventListener("click", open);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });

      return card;
    }

    function setCount(n, total) {
      const el = document.getElementById("count");
      el.textContent = total === n ? `${n} books` : `${n} books (filtered from ${total})`;
    }

    function openModal(book) {
      const modal = document.getElementById("modal");
      const mTitle = document.getElementById("mTitle");
      const mDesc = document.getElementById("mDesc");
      const mCover = document.getElementById("mCover");
      const mBuy = document.getElementById("mBuy");
      const mMeta = document.getElementById("mMeta");

      mTitle.textContent = book.title;
      mDesc.textContent = book.description || "No description available.";
      mCover.src = coverSrc(book.cover);
      mCover.alt = book.title;
      mCover.onerror = () => { mCover.src = PLACEHOLDER; };

      mMeta.innerHTML = "";
      const genreBadge = document.createElement("span");
      genreBadge.className = "badge";
      genreBadge.textContent = book.genre || "Uncategorized";
      mMeta.appendChild(genreBadge);

      if (book.amazonLink) {
        mBuy.href = book.amazonLink;
        mBuy.style.display = "inline-flex";
      } else {
        mBuy.href = "#";
        mBuy.style.display = "none";
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");

      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("modal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    async function loadBooks() {
      const res = await fetch("books.json?cb=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("books.json not found or not readable (" + res.status + ").");
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("books.json must be an array of objects.");
      return data.map(normalizeBook).filter(Boolean);
    }

    function render(books, q, genre) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const qq = (q || "").trim().toLowerCase();
      const gg = (genre || "").trim().toLowerCase();

      const filtered = books.filter(b => {
        const okQ = !qq || b.title.toLowerCase().includes(qq);
        const okG = !gg || (b.genre || "").toLowerCase() === gg;
        return okQ && okG;
      });

      filtered.forEach(b => grid.appendChild(createCard(b, openModal)));
      setCount(filtered.length, books.length);
    }

    function fillGenres(books) {
      const sel = document.getElementById("genre");
      const genres = uniqSorted(books.map(b => b.genre).filter(Boolean));
      for (const g of genres) {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = g;
        sel.appendChild(opt);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById("year").textContent = String(new Date().getFullYear());

      const err = document.getElementById("err");
      const q = document.getElementById("q");
      const genre = document.getElementById("genre");

      const modal = document.getElementById("modal");
      const closeBtn = document.getElementById("mClose");
      const copyBtn = document.getElementById("mCopy");
      const buy = document.getElementById("mBuy");

      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

      copyBtn.addEventListener("click", async () => {
        try{
          const link = buy && buy.href && buy.href !== "#" ? buy.href : "";
          if (!link) return;
          await navigator.clipboard.writeText(link);
          copyBtn.textContent = "Copied!";
          setTimeout(() => copyBtn.textContent = "Copy Amazon link", 1200);
        }catch{
          copyBtn.textContent = "Copy failed";
          setTimeout(() => copyBtn.textContent = "Copy Amazon link", 1200);
        }
      });

      let books = [];
      try{
        books = await loadBooks();
        fillGenres(books);
        render(books, q.value, genre.value);

        q.addEventListener("input", () => render(books, q.value, genre.value));
        genre.addEventListener("change", () => render(books, q.value, genre.value));
      }catch(e){
        err.style.display = "block";
        err.textContent = "Catalog loading error: " + (e && e.message ? e.message : String(e));
        document.getElementById("count").textContent = "0 books";
      }
    });
  </script>
</body>
</html>
